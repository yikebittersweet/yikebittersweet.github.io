<meta property="og:image" content="https://yikebittersweet.github.io/og-image.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --ink:      #001427;
    --ink-2:    #00274C;
    --line:     #123A66;
    --line-soft:#0B2846;
    --maize:    #FFCB05;
    --maize-dim:#9C7F16;
    --paper:    #EDF1F6;
    --muted:    #7C8FA4;

    --display: "Noto Serif SC", "Songti SC", Georgia, serif;
    --body:    "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  h1, p { margin: 0; }
  button { font: inherit; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(120% 78% at 50% -10%, #00335F 0%, rgba(0,39,76,0) 62%),
      var(--ink);
    background-attachment: fixed;
    color: var(--paper);
    font-family: var(--body);
    font-weight: 300;
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    flex-direction: column;
  }

  [data-lang-zh] { display: none; }
  :root[data-lang="zh"] [data-lang-zh] { display: revert; }
  :root[data-lang="zh"] [data-lang-en] { display: none; }

  .lang {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 10;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line-soft);
    padding: 7px 13px;
    cursor: pointer;
    transition: color .16s, border-color .16s;
  }

  .lang:hover { color: var(--maize); border-color: var(--maize-dim); }

  main {
    flex: 1;
    width: 100%;
    max-width: 580px;
    margin: 0 auto;
    padding: 108px 28px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  @media (min-width: 720px) { main { padding-top: 132px; } }

  .mark {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(3rem, 11vw, 4.4rem);
    line-height: 1;
    letter-spacing: 0.02em;
  }

  .mark span { color: var(--maize); }

  .intro {
    margin-top: 26px;
    font-size: 1rem;
    line-height: 1.9;
    color: var(--muted);
    max-width: 34ch;
  }

  .links { margin-top: 54px; border-top: 1px solid var(--line-soft); }

  .link {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 19px 2px;
    border-bottom: 1px solid var(--line-soft);
    text-decoration: none;
    color: inherit;
    transition: padding-left .18s, border-color .18s;
  }

  a.link:hover, a.link:focus-visible {
    padding-left: 12px;
    border-bottom-color: var(--maize-dim);
  }

  .name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.16rem;
    letter-spacing: 0.03em;
    flex: none;
    min-width: 116px;
  }

  a.link:hover .name, a.link:focus-visible .name { color: var(--maize); }

  .handle {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    color: var(--muted);
    flex: 1;
    word-break: break-all;
  }

  .arrow {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--maize);
    opacity: 0;
    transition: opacity .18s;
    flex: none;
  }

  a.link:hover .arrow, a.link:focus-visible .arrow { opacity: 1; }

  .wx-btn {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--maize-dim);
    background: transparent;
    border: 1px solid var(--line);
    padding: 4px 10px;
    cursor: pointer;
    flex: none;
    transition: color .16s, border-color .16s;
  }

  .wx-btn:hover { color: var(--maize); border-color: var(--maize-dim); }

  footer {
    max-width: 580px;
    width: 100%;
    margin: 0 auto;
    padding: 30px 28px 44px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: #55677C;
  }

  :focus-visible { outline: 2px solid var(--maize); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<button class="lang" id="langBtn" type="button">EN</button>

<main>
  <h1 class="mark">椰壳<span>Yike</span></h1>

  <p class="intro">
    <span data-lang-en>PhD student in Michigan. I write about investing and studying abroad, in two languages.</span>
    <span data-lang-zh>在密歇根读博。写投资，也写留学，中英文都写。</span>
  </p>

  <nav class="links">
    <a class="link" href="https://www.xiaohongshu.com/user/profile/5cebfb45000000001100d639" target="_blank" rel="noopener">
      <span class="name">小红书</span>
      <span class="handle">椰壳Yike</span>
      <span class="arrow">↗</span>
    </a>

    <a class="link" href="https://space.bilibili.com/356098056" target="_blank" rel="noopener">
      <span class="name">哔哩哔哩</span>
      <span class="handle">椰壳Yike</span>
      <span class="arrow">↗</span>
    </a>

    <a class="link" href="https://www.instagram.com/yikebittersweet/" target="_blank" rel="noopener">
      <span class="name">Instagram</span>
      <span class="handle">@yikebittersweet</span>
      <span class="arrow">↗</span>
    </a>

    <div class="link">
      <span class="name">微信</span>
      <span class="handle" id="wxSlot" data-id="bigballer33">· · · · · · · ·</span>
      <button class="wx-btn" id="wxBtn" type="button">
        <span data-lang-en>SHOW</span><span data-lang-zh>显示</span>
      </button>
    </div>
  </nav>
</main>

<footer>
  <span>© 2026 椰壳Yike</span>
  <span data-lang-en>Not investment advice</span>
  <span data-lang-zh>内容不构成投资建议</span>
</footer>

<script>
  (function () {
    var root = document.documentElement;
    var langBtn = document.getElementById('langBtn');
    var wxBtn = document.getElementById('wxBtn');
    var wxSlot = document.getElementById('wxSlot');

    function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    function applyLang(l) {
      root.setAttribute('data-lang', l);
      root.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
      langBtn.textContent = l === 'zh' ? 'EN' : '中文';
    }
    applyLang(read('yk-lang') || 'zh');

    langBtn.addEventListener('click', function () {
      var next = root.getAttribute('data-lang') === 'zh' ? 'en' : 'zh';
      applyLang(next);
      store('yk-lang', next);
    });

    wxBtn.addEventListener('click', function () {
      wxSlot.textContent = wxSlot.getAttribute('data-id');
      wxBtn.style.display = 'none';
    });
  })();
</script>
</body>
</html>
